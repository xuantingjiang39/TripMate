<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>找回旧国际记录 · TripMate</title><style>body{margin:0;background:#f5f8fd;color:#172846;font:17px/1.7 system-ui,sans-serif}main{max-width:640px;margin:40px auto;padding:24px}label{display:block;margin-top:18px}input,button{box-sizing:border-box;width:100%;padding:12px;min-height:48px;border:1px solid #aebfd8;border-radius:8px;font:inherit}button{margin-top:20px;background:#285de0;color:white}a{color:#2459d3;display:inline-block;min-height:44px}p{color:#52627a}#message{white-space:pre-line}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #ad570a;outline-offset:3px}</style><script defer src="/legacy-recovery.js"></script></head><body><main><a href="/">返回统一网站</a><h1>找回旧国际站的记录</h1><p>这里只保留 v60 及之前独立国际账号的旧记录。日常请使用统一网站，两边使用原国内账号登录。旧记录不删除，也不会自动合入同名账号。</p><form id="legacy-login"><label>旧国际站邮箱<input id="legacy-email" type="email" autocomplete="username" required></label><label>旧国际站密码<input id="legacy-password" type="password" autocomplete="current-password" required></label><button>验证旧账号</button></form><section id="legacy-records" hidden><h2 id="legacy-account"></h2><p id="legacy-summary"></p><a href="/legacy-records">预览并迁移到统一账号</a><br><a href="/legacy-api/bridge/backup" download="TripMate-旧国际记录备份.json">下载旧记录备份（可选）</a><button id="legacy-logout">退出旧账号</button></section><p id="message" role="status"></p></main></body></html>
